name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI - test and build
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: achados-perdidos-api:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore D6_UNIFOR_ACHADOS_PERDIDOS_API/D6_UNIFOR_ACHADOS_PERDIDOS_API.slnx

      - name: Lint
        run: dotnet format D6_UNIFOR_ACHADOS_PERDIDOS_API/D6_UNIFOR_ACHADOS_PERDIDOS_API.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test D6_UNIFOR_ACHADOS_PERDIDOS_API/D6_UNIFOR_ACHADOS_PERDIDOS_API.slnx --configuration Release --no-restore

      - name: Build and wait for healthy services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Smoke test API and database
        run: curl --fail --silent --show-error http://localhost:8080/api/Item/ListAllItems

      - name: Save validated image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output backend-image.tar "$BACKEND_IMAGE"

      - name: Upload validated image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: validated-backend-image
          path: backend-image.tar
          retention-days: 1

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans

  cd:
    name: CD - publish validated image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download image validated by CI
        uses: actions/download-artifact@v4
        with:
          name: validated-backend-image

      - name: Load image
        run: docker load --input backend-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and publish the same image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          image="${DOCKERHUB_USERNAME}/achados-perdidos-api"
          docker tag achados-perdidos-api:ci "${image}:${GITHUB_SHA}"
          docker tag achados-perdidos-api:ci "${image}:latest"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"